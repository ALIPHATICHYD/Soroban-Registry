name: Smart Contract CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contract-quality:
    name: Format, Compile & Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo dependencies & build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      # Step 1: Format Check across all Cargo projects in the repository
      - name: Check Code Formatting (cargo fmt)
        run: |
          echo "Checking code formatting with cargo fmt across all Cargo manifests..."
          FAILED=0
          for manifest in backend/Cargo.toml cli/Cargo.toml soroban-registry/Cargo.toml; do
            if [ -f "$manifest" ]; then
              echo "==> Formatting check for $manifest"
              cargo fmt --manifest-path "$manifest" --all --check || FAILED=1
            fi
          done
          if [ -f "cli/imported/src/lib.rs" ]; then
            echo "==> Formatting check for cli/imported/src/lib.rs"
            rustfmt cli/imported/src/lib.rs --check || FAILED=1
          fi
          if [ $FAILED -ne 0 ]; then
            echo "Format check failed! Run 'cargo fmt' locally before submitting PR."
            exit 1
          fi

      # Step 2: Compilation Check (target wasm32-unknown-unknown for contracts & crates)
      - name: Compile Smart Contracts (wasm32 target)
        run: |
          echo "Building Rust crates & smart contracts..."
          FAILED=0
          for manifest in cli/imported/Cargo.toml soroban-registry/Cargo.toml cli/Cargo.toml; do
            if [ -f "$manifest" ]; then
              echo "==> Compiling $manifest"
              cargo check --manifest-path "$manifest" --target wasm32-unknown-unknown || cargo check --manifest-path "$manifest" || FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "Compilation failed!"
            exit 1
          fi

      # Step 3: Test Check across all Cargo projects
      - name: Run Smart Contract Tests (cargo test)
        run: |
          echo "Running unit and integration tests..."
          FAILED=0
          for manifest in cli/imported/Cargo.toml soroban-registry/Cargo.toml cli/Cargo.toml; do
            if [ -f "$manifest" ]; then
              echo "==> Testing $manifest"
              cargo test --manifest-path "$manifest" || FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "Tests failed!"
            exit 1
          fi
