# PostgreSQL settings required for continuous archiving and point-in-time
# recovery. Include this from postgresql.conf:
#
#   include = 'postgresql.backup.conf'
#
# or append its contents. Changing wal_level or archive_mode needs a restart;
# archive_command and archive_timeout only need a reload.

# Enough WAL detail to rebuild the cluster from a base backup.
wal_level = replica

# Ship every completed WAL segment to the pgBackRest repositories.
archive_mode = on
archive_command = 'pgbackrest --stanza=soroban-registry archive-push %p'

# Force a WAL switch at least this often, so an idle database still produces
# recoverable checkpoints. This is the hard floor on RPO: with 60s, the worst
# case data loss is the 60s of writes not yet in an archived segment, well
# inside the 15-minute target.
archive_timeout = 60s

# Used during recovery to fetch archived WAL back out of the repository.
restore_command = 'pgbackrest --stanza=soroban-registry archive-get %f "%p"'

# Replication slots and senders for the streaming replica (see
# docs/database-high-availability.md). Backups run against the primary.
max_wal_senders = 10
max_replication_slots = 10

# Keep enough WAL on disk that a brief archive outage does not break recovery.
wal_keep_size = 1GB
