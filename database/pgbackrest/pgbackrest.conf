# pgBackRest configuration for the Soroban Registry database.
#
# Secrets are NEVER stored here. Every credential is supplied through the
# environment, which pgBackRest reads as PGBACKREST_<OPTION> (uppercase, with
# dashes replaced by underscores). scripts/backup.sh maps the repository's
# CLOUDFLARE_* variables onto those names.
#
# Install this file at /etc/pgbackrest/pgbackrest.conf on the database host, or
# point pgBackRest at it with --config.

[global]
# repo1: local storage on the database host. Fast to write and fast to restore
# from, which is what keeps RTO inside one hour for the common case.
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-full-type=count
# Keep WAL only for the backups being retained; older archives are pruned with
# their backup set.
repo1-retention-archive-type=incr

# repo2: off-site copy in Cloudflare R2 (S3-compatible). This is the copy that
# survives losing the whole machine or region.
repo2-type=s3
repo2-path=/soroban-registry
repo2-s3-region=auto
# R2 serves path-style requests; virtual-hosted style is not supported.
repo2-s3-uri-style=path
repo2-retention-full=4
repo2-retention-full-type=count
repo2-retention-archive-type=incr
# Client-side encryption. The passphrase comes from PGBACKREST_REPO2_CIPHER_PASS
# so the off-site copy is unreadable without it, even to the storage provider.
repo2-cipher-type=aes-256-cbc

# Compression: zstd gives the best ratio-per-second for WAL and heap data.
compress-type=zst
compress-level=3

# Asynchronous archiving keeps archive_command fast so a slow upload can never
# stall commits on the primary. This is what makes archive_timeout=60s safe.
archive-async=y
archive-push-queue-max=2GiB
spool-path=/var/spool/pgbackrest

# Parallelism. Tune to the host; 4 is a reasonable default for a 4+ core box.
process-max=4

# Bundle small files into larger objects. This matters most for the off-site
# repository: a PostgreSQL data directory is ~1300 mostly-tiny files, and
# storing each as its own object makes a backup one round trip per file. On a
# link with 0.3s of round-trip latency that is minutes of waiting for a backup
# whose bytes would transfer in seconds, and it bills one write operation per
# file. Bundling turns that into a handful of objects.
repo1-bundle=y
repo2-bundle=y
start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[soroban-registry]
# The stanza name is used by every command and by the archive_command in
# database/pgbackrest/postgresql.backup.conf. Keep the two in sync.
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
